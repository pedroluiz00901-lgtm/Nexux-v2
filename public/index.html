<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUX TELAGEM</title><style>*{box-sizing:border-box}body{margin:0;background:#080d19;color:#f4f7ff;font:16px Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(900px,100%)}header{text-align:center;margin-bottom:24px}h1{font-size:clamp(30px,6vw,52px);letter-spacing:3px;color:#68a5ff;margin:0}p{color:#9eacc7}.panel{background:#111a2d;border:1px solid #263653;border-radius:18px;padding:24px;display:grid;gap:14px;max-width:560px;margin:auto}label{font-size:14px;color:#bdc9df}input{width:100%;padding:14px;border-radius:10px;border:1px solid #354665;background:#0a1222;color:white;font-size:16px;margin-top:7px}button{border:0;border-radius:10px;padding:14px 18px;font-weight:bold;cursor:pointer;background:#397ff0;color:white}button.alt{background:#243653}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{color:#aebbd2;font-size:14px;min-height:20px}.video{margin-top:20px;background:#03060d;border:1px solid #263653;border-radius:14px;min-height:200px;display:grid;place-items:center;color:#7788a7;overflow:hidden}.video video{width:100%;max-height:65vh}.hint{text-align:center;font-size:12px;color:#8290aa}</style><body><main class="wrap"><header><h1>NEXUX TELAGEM</h1><p>Compartilhe sua tela por uma sala</p></header><section class="panel"><label>Código da sala<input id="room" placeholder="Ex.: NEXUX123" maxlength="20"></label><div class="actions"><button id="create">Criar sala e compartilhar</button><button class="alt" id="join">Entrar na sala</button></div><div class="actions"><button class="alt" id="stop" disabled>Parar compartilhamento</button><button class="alt" id="copy">Copiar código</button></div><div id="status" class="status">Escolha uma opção.</div></section><div class="video" id="box"><span>A transmissão aparecerá aqui</span><video id="video" autoplay playsinline></video></div><p class="hint">O navegador pedirá permissão para compartilhar a tela.</p></main><script>
const $=id=>document.getElementById(id);let ws,stream,pc,role,room;
function say(t){$("status").textContent=t}
function connect(r,who){return new Promise((ok,no)=>{room=r.toUpperCase();role=who;ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host);ws.onopen=()=>{ws.send(JSON.stringify({type:"join",room}));ok()};ws.onerror=()=>no(Error("Falha ao conectar"));ws.onmessage=async ev=>{let m=JSON.parse(ev.data);try{if(m.type==="peer-joined"&&role==="host")await makeOffer();if(m.type==="offer"&&role==="viewer"){pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});pc.ontrack=e=>{$("video").srcObject=e.streams[0]};pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:"candidate",candidate:e.candidate}));await pc.setRemoteDescription(m.description);let a=await pc.createAnswer();await pc.setLocalDescription(a);ws.send(JSON.stringify({type:"answer",description:pc.localDescription}))}if(m.type==="answer"&&role==="host"&&pc)await pc.setRemoteDescription(m.description);if(m.type==="candidate"&&pc&&m.candidate)await pc.addIceCandidate(m.candidate);if(m.type==="peer-left")say("A outra pessoa saiu.")}catch(e){say("Erro de vídeo: "+e.message)}}})}
async function makeOffer(){if(!stream)return;pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:"candidate",candidate:e.candidate}));let o=await pc.createOffer();await pc.setLocalDescription(o);ws.send(JSON.stringify({type:"offer",description:pc.localDescription}))}
$("create").onclick=async()=>{try{let c=$("room").value.trim()||Math.random().toString(36).slice(2,8).toUpperCase();$("room").value=c;stream=await navigator.mediaDevices.getDisplayMedia({video:true});$("video").srcObject=stream;$("stop").disabled=false;await connect(c,"host");stream.getVideoTracks()[0].onended=stop;say("Sala pronta. Envie o código "+c)}catch(e){say(e.message)}};
$("join").onclick=async()=>{let c=$("room").value.trim();if(!c)return say("Digite o código.");try{await connect(c,"viewer");say("Conectado à sala "+c)}catch(e){say(e.message)}};
function stop(){stream?.getTracks().forEach(t=>t.stop());pc?.close();ws?.close();stream=null;$("stop").disabled=true;say("Compartilhamento encerrado.")}$("stop").onclick=stop;
$("copy").onclick=async()=>{if(!$("room").value.trim())return say("Digite ou crie um código.");try{await navigator.clipboard.writeText($("room").value.trim());say("Código copiado.")}catch{say("Código: "+$("room").value.trim())}};
</script></body></html>
